services:
  app:
    build: ./docker/php
    container_name: bookaholics_app
    user: "${UID}:${GID}"
    volumes:
      - ./backend:/var/www
    working_dir: /var/www
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: bookaholics_nginx
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: bookaholics_db
    environment:
      POSTGRES_DB: bookaholics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  frontend:
    image: node:20-alpine
    container_name: bookaholics_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - app

volumes:
  frontend_node_modules:
  postgres_data: